# Builds the CASINOGUARD dashboard (casinoguard/) and publishes it to GitHub Pages.
# The data JSON in casinoguard/public/data is generated locally by `npm run data` and committed,
# so CI only needs Node. Enable Pages → "GitHub Actions" in the repository settings.
name: Deploy CASINOGUARD to GitHub Pages
on:
  push:
    branches: [main]
    paths: ["casinoguard/**", ".github/workflows/casinoguard-pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: casinoguard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: casinoguard/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: casinoguard/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
